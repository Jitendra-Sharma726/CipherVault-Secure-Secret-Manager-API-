<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> CipherVault - Secure API</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
  }

   .vault-card {
     background-color: #lelele;
     padding: 30px;
     border-radius: 10px;
     box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
     width: 100%;
     max-width: 350px;
     text-align: center;
     border: 1px solid #333;
     box-sizing: border-box;
  }

   h2{
     margin-top:0;
     color: #4caf50;
     letter-spacing: 1px;
   }

  .input-group {
    margin-bottom: 15px;
    text-align: left;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #444;
    border-radius: 5px;
    color: white;
    box-sizing: border-box;
  }

  input:focus {
    outline: none
    border-color: #4caf50;
  }

 #token-display {
   width: 100%
   padding: 10px;
   margin-bottom: 15px;
   border: 1px soild #444;
   border-radius: 5px;
   background-color: #lalala;
   color: #4caf50;
   box-sizing: border-box;
   font-family: monospace;
   font-size: 11px;
   resize: none;
   word-wrap: break-word;
 }

 button {
   width: 100%;
   padding: 10px;
   margin: 8px 0;
   border: none;
   border-radius: 5px;
   cursor: pointer;
   font-weight: bold;
   font-size: 15px;
   transition: 0.2s;
 }
    
  .btn-primary { background-color: #4caf50; color: white;}
  .btn-primary:hover { background-color: #45a049; }

  .btn-secondary { background-color: #2196f3; color: white;}
  .btn-secondary:hover { background-color: #1976d2; }

  .btn-danger { background-color: #f44336; color: white; }
  .btn-danger:hover { background-color: #da190b; }

  #message-box {
    margin-top :20px
    padding: 10px;
    border-radius: 5px;
    font-size: 0.9em;
    display: none;
    word-wrap: break-word;
  }

  .success { background-color: rgba(76, 175, 80, 0.1); color: #4caf50; border: 1px solid #4caf50;}
  .error   { background-color: rgba(244, 67, 54, 0.1); color: #f44336; border: 1px solid #f44336;}

  #auth-section { display: block;}
  #vault-section { display: none;}
 </style>
</head>
</body>
